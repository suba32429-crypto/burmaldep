name: Build BURMALDEP Android app
on:
  workflow_dispatch:
  push:
    branches: [feature/profile-live-feed]
    paths:
      - 'index.html'
      - 'api/**'
      - 'assets/**'
      - '*.jpg'
      - '*.b64'
      - 'app-icon.svg'
      - 'manifest.webmanifest'
      - 'offline.html'
      - 'sw.js'
      - 'capacitor.config.json'
      - '.github/workflows/android-beta.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare the complete local game
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          mkdir -p www/assets
          cp index.html www/index.html
          cp ./*.jpg www/
          cp burmaldep-avatar.jpg.b64 app-icon.svg manifest.webmanifest sw.js offline.html www/
          cp -R assets/. www/assets/
          test -s www/index.html
          test -s www/burim.jpg
          test -s www/manifest.webmanifest
          npx cap add android
          npx cap sync android
      - name: Apply BURMALDEP app icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          base64 -d burmaldep-avatar.jpg.b64 > /tmp/burmaldep-avatar.jpg
          for spec in 'mdpi 48' 'hdpi 72' 'xhdpi 96' 'xxhdpi 144' 'xxxhdpi 192'; do
            set -- $spec
            dir="android/app/src/main/res/mipmap-$1"
            mkdir -p "$dir"
            convert /tmp/burmaldep-avatar.jpg -resize "$2x$2^" -gravity center -extent "$2x$2" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/res/mipmap-anydpi-v26
          convert /tmp/burmaldep-avatar.jpg -resize '432x432^' -gravity center -extent 432x432 android/app/src/main/res/drawable-nodpi/burmaldep_foreground.png
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/black"/>
            <foreground android:drawable="@drawable/burmaldep_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Build installable Android APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BURMALDEP-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: BURMALDEP Android — БЕТА-ТЕСТ
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
          fail_on_unmatched_files: true
          overwrite_files: true
